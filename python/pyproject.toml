[project]
name = "echo-client"
version = "0.1.1"
description = "Server-side client for the Echo feedback API, with optional Django views for the echo-feedback widget."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
django = ["django>=4.2"]
test = ["pytest>=8.3", "responses>=0.25", "django>=4.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
