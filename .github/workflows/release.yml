name: Release

# Tag vX.Y.Z on main: GitHub Release with the npm pack tarball and the IIFE bundle.
# echo-client (Python) installs from the same tag with pip (git URL, subdirectory python).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$(node -p 'require("./package.json").version')" = "$version"
          grep -q "^version = \"$version\"$" ../python/pyproject.toml
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "guestready-echo-feedback-${version}.tgz" \
            dist/echo-feedback.iife.js
